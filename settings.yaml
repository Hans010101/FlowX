# settings.yaml —— 流水线运行参数

pipeline:
  mode: review              # review=生成本地网页手动发；publish=自动发头条（以后）
  account: hans_toutiao
  max_per_run: 8            # 每次总产出上限
  # 每个赛道每次最多几篇（按实际阅读表现调权重：民生最多、科技次之、体育娱乐各1）
  per_track_quota:
    民生: 3
    科技: 2
    体育: 1
    娱乐: 1
  per_track_default: 1      # 未列出的赛道默认名额

image:
  # mode: scrape = 抓报道原图（贴合内容，体育也能拿到真实赛事图；有版权风险，个人自用）
  #       pexels = 用免费图库（安全但可能不贴合）
  mode: scrape
  provider: pexels          # mode=pexels 时用，需 PEXELS_API_KEY
  skip_tracks: []           # 这些赛道不自动配图、留空手动配（如想体育手动配，填 [体育]）

hotspot:
  provider: official        # baidu/toutiao 官方接口直抓；其余源走 base_url 的 DailyHotApi 聚合
  # DailyHotApi 聚合服务（docker: imsyy/dailyhot-api，端口6688）。挂了不影响 baidu/toutiao
  base_url: http://127.0.0.1:6688
  # baidu/toutiao 原生直抓；其余为 DailyHotApi 调用名（加平台=在这加一个名字即可）
  sources: [baidu, toutiao, douyin, weibo, zhihu, bilibili, 36kr, thepaper]
  # 按源分别设抓取条数（未列到的默认30）：百度多抓、其余控量避免选题页过长
  top_n:
    baidu: 40
    toutiao: 10
    douyin: 20
    weibo: 20
    zhihu: 15
    bilibili: 15
    36kr: 15
    thepaper: 15
  research_count: 5

# 自动流水线：定时 选题→生成→质检→筛档→CLI发进平台草稿箱
# ⚠️ 运行时需浏览器 + Wechatsync 扩展开着（CLI 借扩展登录态发草稿）
auto:
  enabled: true
  schedule: "07:00"   # 每天几点跑（HH:MM；界面/接口改动即生效，无需重启）
  count: 3   # 每次最多选几条热点出稿
  min_level: green        # 质量闸：green=只绿档进草稿；green+yellow=绿黄都进（红档一律拦）
  tracks: []              # 空=用当前开启的全部赛道；也可指定，如 [keji, minsheng]
  platforms: [toutiao]    # 草稿发到哪些平台
  auto_publish: false     # 第二层：真发布开关（未实现，开了只提示占位，不会真发）

research:
  # 搜索源兜底链：依次尝试，第一个结果够好就用（tavily 免费额度优先，省成本）；
  # 不达标（条数<min_results 或素材总字数<min_chars）自动回退下一个（bocha 付费、内容更全）
  providers: [tavily, bocha]
  min_results: 3               # 少于这么多条 → 回退
  min_chars: 300               # 素材总字数低于此 → 回退
  provider: bocha              # 兼容：仅当没配 providers 时用这个单一源
